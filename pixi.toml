[workspace]
name = "dseams2_repro"
version = "2.7.0"
description = "Reproducibility package for the d-SEAMS 2.0 paper: Snakemake + HyperQueue campaign over the locked engine, front ends and public trajectories"
channels = ["conda-forge"]
platforms = ["linux-64"]
authors = ["Rohit Goswami <rgoswami@ieee.org>"]

# One environment builds the locked seams-core tree (its default pixi
# dependencies are mirrored here), installs the Python binding, builds
# yodaStruct, and runs the comparison tools.
[dependencies]
python = "3.12.*"
compilers = ">=1.9.0,<2"
rust = ">=1.85"
eigen = "3.4.0.*"
libblas = ">=3.11.0,<4"
liblapack = ">=3.11.0,<4"
catch2 = ">=3.6.0,<4"
meson = ">=1.3.0"
ninja = ">=1.13.2,<2"
pkgconfig = ">=1.5.5,<2"
nanobind = ">=2.14"
numpy = ">=1.24"
pip = "*"
meson-python = ">=0.16"
pytest = ">=8.0"
libhwy = ">=1.3.0"
chemfiles = ">=0.10"
git = "*"
lua = ">=5.4,<5.4.7"
freud = ">=3.0"
pyscal3 = ">=3.0"
jupytext = ">=1.16"
ipykernel = ">=6.0"
papermill = ">=2.4"
matplotlib-base = ">=3.8"
pyyaml = "*"

[pypi-dependencies]
snakemake = ">=8.0"
# OVITO ships PTM and CHILL+ as a pip wheel; used by the tool comparison
ovito = ">=3.10"
genice2 = ">=2.2"

[tasks]
# Login node: sources, wraps, data, HyperQueue
prep = "bash scripts/elja_submit.sh prep"
# Exclusive Slurm allocation with HyperQueue inside
submit = "bash scripts/elja_submit.sh submit"
# Any machine, no scheduler
run-local = "SEAMS_NO_HQ=1 snakemake -s workflow/Snakefile --configfile config/config.yaml --cores all --printshellcmds"
dry-run = "snakemake -s workflow/Snakefile --configfile config/config.yaml --dry-run --cores 1"
smoke = "SEAMS_NO_HQ=1 snakemake -s workflow/Snakefile --configfile config/smoke.yaml --cores all --printshellcmds"
test = "python scripts/test_aggregate.py && python scripts/test_ecosystem_sources.py && python scripts/test_workflow_parity.py && python scripts/test_committor_to_pgf.py && python scripts/test_applications_pgf.py"
stage-zenodo = "bash scripts/stage_zenodo.sh"
package-archive = "bash -c 'set -e; ts=$(date -u +%Y%m%d); out=dseams2_repro_archive_${ts}.tar.xz; tar --exclude=./.pixi --exclude=./.git --exclude=./sources --exclude=./build-* --exclude=./python-site --exclude=./.snakemake --exclude=./data/figshare --exclude=./data/public-ice --exclude=__pycache__ --exclude=./results/brine/*.out --exclude=./results/production/*.out --exclude=traj.lammpstrj -cJf \"$out\" .; sha256sum \"$out\" | tee \"$out.sha256\"'"

# LAMMPS with PLUMED for the seeding campaign; plumed is pinned by lammps.
# On Elja the conda-forge lammps binary needs GLIBC_2.34; scripts/elja_lmp.sh
# runs EasyBuild LAMMPS 23Jun2022 instead. genice2 builds the Ih brine box.
[feature.production]
platforms = ["linux-64"]

[feature.production.dependencies]
lammps = ">=2025.07"
plumed = ">=2.9,<2.10"
pyyaml = "*"

[feature.production.pypi-dependencies]
genice2 = ">=2.2"

[environments]
production = { features = ["production"] }
