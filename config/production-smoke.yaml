# Tiny matrix for a laptop or one terra core: not a result.
# Separate trees so a smoke cannot rewrite the production packing.
results_root: results/smoke
brine_root: results/smoke-brine
n_liquid: 512
temperatures: [215]
seed_sizes: [50, 100]
polymorphs: [ic]
replicas: 2
pressure_bar: 1.0
steps: 2000
dump_every: 500
plumed_stride: 100
melt_basin: 10
grow_factor: 2.0
lammps_threads: 2
liquid_melt_steps: 2000
liquid_eq_steps: 2000
brine:
  temperatures: [240]
  pairs: [4]
  replicas: 1
  rep: [2, 2, 4]
  melt_steps: 200
  steps: 400
  dump_every: 200
  plumed_stride: 100
